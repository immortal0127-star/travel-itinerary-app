<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="手機版旅遊行程 App，含自動排程、Google Maps 連結與每日總時長。"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>名古屋 + 黑部立山六日遊</title>
    <style>
      :root {
        --ink: #17201d;
        --muted: #65736f;
        --line: #d7e0dc;
        --paper: #f5f7f4;
        --panel: #ffffff;
        --teal: #0f766e;
        --teal-2: #0b5e57;
        --blue: #2563eb;
        --coral: #e76f51;
        --sun: #f4a261;
        --mint: #d9f2e7;
        --cream: #fff7e7;
        --shadow: 0 18px 45px rgba(14, 31, 28, 0.13);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--paper);
      }

      body {
        margin: 0;
        min-height: 100%;
        color: var(--ink);
        background:
          linear-gradient(145deg, rgba(15, 118, 110, 0.16) 0 14rem, transparent 34rem),
          linear-gradient(22deg, rgba(244, 162, 97, 0.2) 0 10rem, transparent 30rem),
          var(--paper);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        width: min(100%, 1060px);
        margin: 0 auto;
        padding: max(14px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
      }

      .topbar {
        display: grid;
        gap: 16px;
        padding: 18px 16px;
        border: 1px solid rgba(255, 255, 255, 0.74);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(238, 247, 243, 0.9)),
          var(--panel);
        box-shadow: var(--shadow);
      }

      .title-row {
        display: grid;
        gap: 12px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        max-width: 760px;
        font-size: clamp(30px, 8.4vw, 52px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .trip-meta {
        max-width: 760px;
        color: #40514c;
        font-size: 14px;
        line-height: 1.55;
        margin-top: 10px;
      }

      .weather-chip {
        width: fit-content;
        border: 1px solid rgba(15, 118, 110, 0.2);
        background: var(--mint);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--teal-2);
        font-weight: 700;
        font-size: 13px;
      }

      .hero-facts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .fact {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        border: 1px solid rgba(23, 32, 29, 0.09);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        color: #2f3d39;
        padding: 6px 9px;
        font-size: 12px;
        font-weight: 800;
      }

      .route-visual {
        display: grid;
        gap: 9px;
        padding: 12px;
        border-radius: 8px;
        background: #17201d;
        color: #ffffff;
        overflow: hidden;
      }

      .route-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        font-weight: 850;
        color: rgba(255, 255, 255, 0.84);
      }

      .route-line {
        display: grid;
        grid-template-columns: repeat(5, minmax(82px, 1fr));
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .route-line::-webkit-scrollbar {
        display: none;
      }

      .route-stop {
        position: relative;
        min-height: 64px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        padding: 10px;
      }

      .route-stop::before {
        content: "";
        display: block;
        width: 9px;
        height: 9px;
        margin-bottom: 8px;
        border-radius: 999px;
        background: var(--sun);
        box-shadow: 0 0 0 4px rgba(244, 162, 97, 0.18);
      }

      .route-stop strong,
      .route-stop span {
        display: block;
        white-space: nowrap;
      }

      .route-stop strong {
        font-size: 13px;
        line-height: 1.15;
      }

      .route-stop span {
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
      }

      .day-tabs {
        display: flex;
        gap: 9px;
        overflow-x: auto;
        padding: 2px 0 4px;
        scrollbar-width: none;
      }

      .day-tabs::-webkit-scrollbar {
        display: none;
      }

      .day-tab {
        min-width: 108px;
        border: 1px solid rgba(23, 32, 29, 0.1);
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
        border-radius: 8px;
        padding: 11px 12px;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(25, 33, 31, 0.05);
      }

      .day-tab[aria-selected="true"] {
        border-color: #0a5f58;
        background: var(--teal);
        color: #ffffff;
        box-shadow: 0 12px 26px rgba(15, 118, 110, 0.22);
      }

      .day-tab strong,
      .day-tab span {
        display: block;
        white-space: nowrap;
      }

      .day-tab strong {
        font-size: 15px;
        line-height: 1.1;
      }

      .day-tab span {
        margin-top: 4px;
        font-size: 12px;
        opacity: 0.82;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 46px;
        border: 1px solid rgba(23, 32, 29, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        color: var(--ink);
        padding: 9px 11px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin: 14px 0 14px;
      }

      .summary-card {
        min-height: 82px;
        border: 1px solid rgba(15, 118, 110, 0.18);
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        padding: 12px;
        box-shadow: 0 10px 30px rgba(25, 33, 31, 0.06);
      }

      .summary-card:nth-child(2) {
        border-color: rgba(231, 111, 81, 0.22);
      }

      .summary-card:nth-child(3) {
        border-color: rgba(37, 99, 235, 0.2);
      }

      .summary-card span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .summary-card strong {
        display: block;
        margin-top: 7px;
        font-size: clamp(18px, 5vw, 24px);
        line-height: 1;
      }

      .timeline {
        display: grid;
        gap: 11px;
      }

      .stop {
        position: relative;
        display: grid;
        grid-template-columns: 78px minmax(0, 1fr);
        gap: 13px;
        padding: 14px;
        border: 1px solid rgba(23, 32, 29, 0.09);
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(15, 118, 110, 0.08), transparent 34%),
          rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
      }

      .stop::before {
        content: attr(data-step);
        position: absolute;
        top: 12px;
        right: 12px;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: #17201d;
        color: #ffffff;
        font-size: 12px;
        font-weight: 900;
      }

      .timebox {
        display: grid;
        align-content: start;
        gap: 7px;
        min-width: 0;
      }

      .arrival {
        color: var(--teal-2);
        font-size: 23px;
        font-weight: 850;
        line-height: 1;
      }

      .leave {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .stop-main {
        display: grid;
        gap: 10px;
        min-width: 0;
      }

      .stop h2 {
        width: calc(100% - 36px);
        font-size: 18px;
        line-height: 1.25;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .address {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .details {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        border-radius: 8px;
        padding: 5px 8px;
        background: #eef5f1;
        color: #31413d;
        font-size: 12px;
        font-weight: 750;
      }

      .tag.travel {
        background: #fff0e8;
        color: #7b3a25;
      }

      .tag.note {
        background: #eef2ff;
        color: #273c7a;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition:
          transform 140ms ease,
          box-shadow 140ms ease,
          background-color 140ms ease;
      }

      .action:active {
        transform: translateY(1px);
      }

      .action.map {
        background: var(--teal);
        box-shadow: 0 10px 22px rgba(15, 118, 110, 0.18);
      }

      .action.route {
        background: var(--coral);
        box-shadow: 0 10px 22px rgba(231, 111, 81, 0.18);
      }

      .action.secondary {
        border-color: var(--line);
        background: #ffffff;
        color: var(--ink);
      }

      .footer-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(18px);
        width: min(calc(100% - 32px), 420px);
        border-radius: 8px;
        background: #19211f;
        color: #ffffff;
        padding: 12px 14px;
        text-align: center;
        font-weight: 800;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (min-width: 760px) {
        .app {
          padding: max(22px, env(safe-area-inset-top)) 28px max(34px, env(safe-area-inset-bottom));
        }

        .topbar {
          grid-template-columns: minmax(0, 1fr) 340px;
          align-items: start;
          padding: 22px;
        }

        .title-row {
          grid-column: 1 / 2;
        }

        .day-tabs {
          grid-column: 1 / -1;
          min-width: 0;
        }

        .controls {
          align-self: start;
        }

        .route-visual {
          grid-column: 2 / 3;
          grid-row: 1 / 2;
        }

        .timeline {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 420px) {
        .controls,
        .summary-grid,
        .footer-actions {
          grid-template-columns: 1fr;
        }

        .stop {
          grid-template-columns: 64px minmax(0, 1fr);
          padding: 12px;
        }

        .arrival {
          font-size: 19px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="topbar" aria-label="旅遊行程">
        <div class="title-row">
          <div>
            <h1 id="tripTitle">旅遊行程</h1>
            <p class="trip-meta" id="tripMeta"></p>
          </div>
          <div class="hero-facts" aria-label="旅程摘要">
            <span class="fact">6 天</span>
            <span class="fact">名古屋</span>
            <span class="fact">黑部立山</span>
            <span class="fact">上高地</span>
          </div>
          <div class="weather-chip" id="dayLabel"></div>
        </div>

        <div class="route-visual" aria-label="旅程路線">
          <div class="route-label">
            <span>Route</span>
            <span>KHH → KIX → NGO → KHH</span>
          </div>
          <div class="route-line">
            <div class="route-stop"><strong>名古屋</strong><span>市區 · 吉卜力</span></div>
            <div class="route-stop"><strong>高山</strong><span>老街 · 朝市</span></div>
            <div class="route-stop"><strong>白川鄉</strong><span>合掌村</span></div>
            <div class="route-stop"><strong>立山黑部</strong><span>扇澤 → 富山</span></div>
            <div class="route-stop"><strong>常滑</strong><span>機場 · 採買</span></div>
          </div>
        </div>

        <nav class="day-tabs" id="dayTabs" aria-label="切換天數"></nav>

        <div class="controls">
          <div class="field">
            <label for="startTime">出發時間</label>
            <input id="startTime" type="time" />
          </div>
          <div class="field">
            <label for="travelMode">導航方式</label>
            <select id="travelMode">
              <option value="driving">開車</option>
              <option value="transit" selected>大眾運輸</option>
              <option value="walking">步行</option>
            </select>
          </div>
        </div>
      </section>

      <section class="summary-grid" aria-label="當日摘要">
        <article class="summary-card">
          <span>預計結束</span>
          <strong id="endTime">--:--</strong>
        </article>
        <article class="summary-card">
          <span>行程停留</span>
          <strong id="stayTotal">0 分</strong>
        </article>
        <article class="summary-card">
          <span>交通預估</span>
          <strong id="travelTotal">0 分</strong>
        </article>
      </section>

      <section class="timeline" id="timeline" aria-label="行程列表"></section>

      <section class="footer-actions" aria-label="更多操作">
        <button class="action secondary" id="copyPlan" type="button">複製今日行程</button>
        <a class="action map" id="fullRoute" href="#" target="_blank" rel="noopener">開啟整日路線</a>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

      const state = {
        selectedDay: Number(localStorage.getItem("selectedDay") || 0),
        mode: localStorage.getItem("travelMode") || "transit"
      };

      const tabsEl = document.getElementById("dayTabs");
      const timelineEl = document.getElementById("timeline");
      const startTimeEl = document.getElementById("startTime");
      const travelModeEl = document.getElementById("travelMode");
      const toastEl = document.getElementById("toast");

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function parseTime(value) {
        const [hours, minutes] = value.split(":").map(Number);
        return hours * 60 + minutes;
      }

      function formatTime(minutes) {
        const normalized = ((minutes % 1440) + 1440) % 1440;
        return `${pad(Math.floor(normalized / 60))}:${pad(normalized % 60)}`;
      }

      function formatMinutes(minutes) {
        if (minutes < 60) return `${minutes} 分`;
        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;
        return rest ? `${hours} 小時 ${rest} 分` : `${hours} 小時`;
      }

      function queryFor(stop) {
        return encodeURIComponent(`${stop.place || stop.name} ${stop.address || ""}`.trim());
      }

      function mapUrl(stop) {
        return `https://www.google.com/maps/search/?api=1&query=${queryFor(stop)}`;
      }

      function routeUrl(origin, destination) {
        const destinationQuery = queryFor(destination);
        if (!origin) {
          return `https://www.google.com/maps/dir/?api=1&destination=${destinationQuery}&travelmode=${state.mode}`;
        }
        return `https://www.google.com/maps/dir/?api=1&origin=${queryFor(origin)}&destination=${destinationQuery}&travelmode=${state.mode}`;
      }

      function fullRouteUrl(day) {
        const stops = day.stops;
        const origin = queryFor(stops[0]);
        const destination = queryFor(stops[stops.length - 1]);
        const waypoints = stops.slice(1, -1).map(queryFor).join("|");
        return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=${state.mode}`;
      }

      function scheduleFor(day) {
        if (day.fixedSchedule) {
          return day.stops.map((stop) => ({
            ...stop,
            arrival: parseTime(stop.start),
            leave: parseTime(stop.end),
            travelMinutes: stop.travelMinutes || 0,
            stayMinutes: stop.stayMinutes || parseTime(stop.end) - parseTime(stop.start)
          }));
        }

        const startOverride = localStorage.getItem(`start-${state.selectedDay}`);
        const startTime = startOverride || day.startTime;
        let cursor = parseTime(startTime);
        return day.stops.map((stop) => {
          cursor += stop.travelMinutes || 0;
          const arrival = cursor;
          const leave = arrival + stop.stayMinutes;
          cursor = leave;
          return { ...stop, arrival, leave, travelMinutes: stop.travelMinutes || 0 };
        });
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toastEl.classList.remove("show"), 1800);
      }

      function renderTabs() {
        tabsEl.innerHTML = "";
        trip.days.forEach((day, index) => {
          const button = document.createElement("button");
          button.className = "day-tab";
          button.type = "button";
          button.setAttribute("aria-selected", String(index === state.selectedDay));
          button.innerHTML = `<strong>${day.label}</strong><span>${day.title}</span>`;
          button.addEventListener("click", () => {
            state.selectedDay = index;
            localStorage.setItem("selectedDay", String(index));
            render();
          });
          tabsEl.appendChild(button);
        });
      }

      function render() {
        const day = trip.days[state.selectedDay];
        const scheduled = scheduleFor(day);
        const totalStay = scheduled.reduce((sum, stop) => sum + stop.stayMinutes, 0);
        const totalTravel = scheduled.reduce((sum, stop) => sum + stop.travelMinutes, 0);
        const end = scheduled[scheduled.length - 1].leave;

        document.getElementById("tripTitle").textContent = trip.title;
        document.getElementById("tripMeta").textContent = `${trip.traveler} · ${trip.note}`;
        document.getElementById("dayLabel").textContent = `${day.date} · ${day.title}`;
        document.getElementById("endTime").textContent = formatTime(end);
        document.getElementById("stayTotal").textContent = formatMinutes(totalStay);
        document.getElementById("travelTotal").textContent = formatMinutes(totalTravel);
        document.getElementById("fullRoute").href = fullRouteUrl(day);
        startTimeEl.value = day.fixedSchedule
          ? day.startTime
          : localStorage.getItem(`start-${state.selectedDay}`) || day.startTime;
        startTimeEl.disabled = Boolean(day.fixedSchedule);
        startTimeEl.title = day.fixedSchedule ? "此日使用固定班次時間表" : "";
        travelModeEl.value = state.mode;

        renderTabs();
        timelineEl.innerHTML = "";

        scheduled.forEach((stop, index) => {
          const previousStop = index > 0 ? day.stops[index - 1] : null;
          const card = document.createElement("article");
          card.className = "stop";
          card.dataset.step = String(index + 1).padStart(2, "0");
          card.innerHTML = `
            <div class="timebox">
              <div class="arrival">${formatTime(stop.arrival)}</div>
              <div class="leave">離開 ${formatTime(stop.leave)}</div>
            </div>
            <div class="stop-main">
              <div>
                <h2>${stop.name}</h2>
                <p class="address">${stop.address}</p>
              </div>
              <div class="details">
                <span class="tag">停留 ${formatMinutes(stop.stayMinutes)}</span>
                <span class="tag travel">交通 ${formatMinutes(stop.travelMinutes)}</span>
                <span class="tag note">${stop.memo}</span>
              </div>
              <div class="actions">
                <a class="action map" href="${mapUrl(stop)}" target="_blank" rel="noopener">地圖</a>
                <a class="action route" href="${routeUrl(previousStop, stop)}" target="_blank" rel="noopener">導航</a>
              </div>
            </div>
          `;
          timelineEl.appendChild(card);
        });
      }

      startTimeEl.addEventListener("change", () => {
        if (trip.days[state.selectedDay].fixedSchedule) return;
        localStorage.setItem(`start-${state.selectedDay}`, startTimeEl.value);
        render();
      });

      travelModeEl.addEventListener("change", () => {
        state.mode = travelModeEl.value;
        localStorage.setItem("travelMode", state.mode);
        render();
      });

      document.getElementById("copyPlan").addEventListener("click", async () => {
        const day = trip.days[state.selectedDay];
        const lines = scheduleFor(day).map((stop) => {
          return `${formatTime(stop.arrival)}-${formatTime(stop.leave)} ${stop.name}（停留 ${formatMinutes(stop.stayMinutes)}，交通 ${formatMinutes(stop.travelMinutes)}）`;
        });
        const text = `${trip.title} ${day.label} ${day.title}\n${lines.join("\n")}`;
        try {
          await navigator.clipboard.writeText(text);
          showToast("今日行程已複製");
        } catch (error) {
          showToast("無法自動複製，請改用瀏覽器分享");
        }
      });

      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      }

      render();
    </script>
