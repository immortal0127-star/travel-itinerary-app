<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="手機版旅遊行程 App，含自動排程、Google Maps 連結與每日總時長。"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>名古屋 + 黑部立山六日遊</title>
    <style>
      :root {
        --ink: #17201d;
        --muted: #65736f;
        --line: #d7e0dc;
        --paper: #f5f7f4;
        --panel: #ffffff;
        --teal: #0f766e;
        --teal-2: #0b5e57;
        --blue: #2563eb;
        --coral: #e76f51;
        --sun: #f4a261;
        --mint: #d9f2e7;
        --cream: #fff7e7;
        --accent: #0f766e;
        --accent-2: #e76f51;
        --accent-soft: rgba(15, 118, 110, 0.1);
        --day-image: url("./assets/day-1.jpg");
        --shadow: 0 18px 45px rgba(14, 31, 28, 0.13);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--paper);
      }

      body {
        position: relative;
        margin: 0;
        min-height: 100%;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 8%, rgba(244, 162, 97, 0.25), transparent 16rem),
          linear-gradient(145deg, rgba(15, 118, 110, 0.18) 0 14rem, transparent 34rem),
          linear-gradient(22deg, rgba(37, 99, 235, 0.1) 0 12rem, transparent 34rem),
          var(--paper);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          linear-gradient(180deg, rgba(245, 247, 244, 0.34), rgba(245, 247, 244, 0.92) 58%),
          var(--day-image) center / cover no-repeat;
        opacity: 0.72;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(circle at 82% 8%, rgba(255, 247, 231, 0.58), transparent 19rem),
          linear-gradient(120deg, rgba(245, 247, 244, 0.86), rgba(245, 247, 244, 0.58));
      }

      body[data-day="0"] {
        --accent: #0f766e;
        --accent-2: #e76f51;
        --accent-soft: rgba(15, 118, 110, 0.1);
      }

      body[data-day="1"] {
        --accent: #7c3aed;
        --accent-2: #db2777;
        --accent-soft: rgba(124, 58, 237, 0.1);
      }

      body[data-day="2"] {
        --accent: #b45309;
        --accent-2: #0f766e;
        --accent-soft: rgba(180, 83, 9, 0.12);
      }

      body[data-day="3"] {
        --accent: #2563eb;
        --accent-2: #0f766e;
        --accent-soft: rgba(37, 99, 235, 0.1);
      }

      body[data-day="4"] {
        --accent: #15803d;
        --accent-2: #ca8a04;
        --accent-soft: rgba(21, 128, 61, 0.1);
      }

      body[data-day="5"] {
        --accent: #dc2626;
        --accent-2: #2563eb;
        --accent-soft: rgba(220, 38, 38, 0.1);
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        position: relative;
        z-index: 1;
        width: min(100%, 1060px);
        margin: 0 auto;
        padding: max(14px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
      }

      .topbar {
        display: grid;
        gap: 16px;
        padding: 18px 16px;
        border: 1px solid rgba(255, 255, 255, 0.74);
        border-radius: 8px;
        background:
          linear-gradient(112deg, rgba(255, 255, 255, 0.96) 0 48%, rgba(255, 255, 255, 0.7)),
          linear-gradient(0deg, rgba(15, 32, 29, 0.08), rgba(15, 32, 29, 0.08)),
          var(--day-image) right center / cover no-repeat,
          linear-gradient(90deg, var(--accent-soft), transparent),
          var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .title-row {
        display: grid;
        gap: 12px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        max-width: 760px;
        font-size: 34px;
        line-height: 0.98;
        letter-spacing: 0;
      }

      .trip-meta {
        max-width: 760px;
        color: #40514c;
        font-size: 14px;
        line-height: 1.55;
        margin-top: 10px;
      }

      .weather-chip {
        width: fit-content;
        border: 1px solid color-mix(in srgb, var(--accent) 24%, white);
        background: color-mix(in srgb, var(--accent) 12%, white);
        border-radius: 999px;
        padding: 10px 12px;
        color: color-mix(in srgb, var(--accent) 78%, #17201d);
        font-weight: 700;
        font-size: 13px;
      }

      .hero-facts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .fact {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        border: 1px solid rgba(23, 32, 29, 0.09);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: #2f3d39;
        padding: 6px 9px;
        font-size: 12px;
        font-weight: 800;
      }

      .photo-strip {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(128px, 36%);
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .photo-strip::-webkit-scrollbar {
        display: none;
      }

      .photo-tile {
        position: relative;
        min-height: 92px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 8px;
        overflow: hidden;
        background-image:
          linear-gradient(180deg, rgba(23, 32, 29, 0.04), rgba(23, 32, 29, 0.62)),
          var(--day-image);
        background-size: cover;
        box-shadow: 0 12px 26px rgba(14, 31, 28, 0.12);
      }

      .photo-tile:nth-child(1) {
        background-position: 14% center;
      }

      .photo-tile:nth-child(2) {
        background-position: 54% center;
      }

      .photo-tile:nth-child(3) {
        background-position: 88% center;
      }

      .photo-tile span {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 9px;
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.42);
      }

      .day-spotlight {
        position: relative;
        display: grid;
        gap: 10px;
        margin: 14px 0;
        padding: 14px;
        border: 1px solid color-mix(in srgb, var(--accent) 18%, white);
        border-radius: 8px;
        background:
          linear-gradient(135deg, color-mix(in srgb, var(--accent) 11%, white), rgba(255, 255, 255, 0.9)),
          #ffffff;
        box-shadow: 0 12px 30px rgba(14, 31, 28, 0.08);
        overflow: hidden;
      }

      .day-spotlight::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.96) 0 46%, rgba(255, 255, 255, 0.72)),
          var(--day-image) right center / cover no-repeat;
        opacity: 0.9;
      }

      .day-spotlight > * {
        position: relative;
        z-index: 1;
      }

      .spotlight-kicker {
        color: color-mix(in srgb, var(--accent) 78%, #17201d);
        font-size: 12px;
        font-weight: 900;
      }

      .spotlight-title {
        font-size: 21px;
        line-height: 1.2;
        font-weight: 900;
      }

      .spotlight-track {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
      }

      .spotlight-place {
        min-height: 44px;
        border: 1px solid rgba(23, 32, 29, 0.08);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        padding: 9px;
        font-size: 13px;
        font-weight: 850;
        overflow-wrap: anywhere;
      }

      .spotlight-arrow {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 900;
      }

      .spotlight-note {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .route-visual {
        display: grid;
        gap: 9px;
        padding: 14px;
        border-radius: 8px;
        background:
          linear-gradient(160deg, color-mix(in srgb, var(--accent) 34%, #17201d), rgba(23, 32, 29, 0.9) 56%),
          linear-gradient(0deg, rgba(23, 32, 29, 0.38), rgba(23, 32, 29, 0.38)),
          var(--day-image) center / cover no-repeat,
          #17201d;
        color: #ffffff;
        overflow: hidden;
      }

      .route-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        font-weight: 850;
        color: rgba(255, 255, 255, 0.84);
      }

      .route-label span:last-child {
        text-align: right;
      }

      .route-line {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(132px, 42%);
        grid-template-columns: none;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 2px;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
      }

      .route-line::-webkit-scrollbar {
        display: none;
      }

      .route-stop {
        position: relative;
        display: grid;
        align-content: space-between;
        min-height: 94px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        padding: 12px;
        text-decoration: none;
        scroll-snap-align: start;
      }

      .route-stop::after {
        content: "";
        position: absolute;
        top: 24px;
        left: 38px;
        right: -16px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(244, 162, 97, 0.75), rgba(244, 162, 97, 0.1));
      }

      .route-stop[data-last="true"]::after {
        display: none;
      }

      .hero-scene {
        position: relative;
        min-height: 96px;
        margin-top: 2px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(23, 32, 29, 0.18)),
          var(--day-image) center 58% / cover no-repeat;
        overflow: hidden;
      }

      .sun-disc {
        position: absolute;
        top: 14px;
        right: 20px;
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: var(--sun);
        box-shadow: 0 0 0 10px rgba(244, 162, 97, 0.12);
      }

      .mountain {
        position: absolute;
        bottom: 0;
        width: 58%;
        height: 66%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.18));
        clip-path: polygon(0 100%, 48% 0, 100% 100%);
      }

      .mountain.one {
        left: -8%;
      }

      .mountain.two {
        right: -6%;
        height: 78%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.14));
      }

      .rail {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 14px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.62);
      }

      .rail::before,
      .rail::after {
        content: "";
        position: absolute;
        top: -16px;
        width: 3px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.42);
        transform: rotate(22deg);
      }

      .rail::before {
        left: 28%;
      }

      .rail::after {
        left: 64%;
      }

      .route-stop::before {
        content: attr(data-step);
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        margin-bottom: 10px;
        border-radius: 999px;
        background: var(--sun);
        color: #17201d;
        font-size: 11px;
        font-weight: 950;
        box-shadow: 0 0 0 5px rgba(244, 162, 97, 0.18);
        position: relative;
        z-index: 1;
      }

      .route-stop strong,
      .route-stop span {
        display: block;
      }

      .route-stop strong {
        min-height: 34px;
        font-size: 14px;
        line-height: 1.18;
        overflow: hidden;
      }

      .route-stop span {
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
      }

      .route-time {
        color: rgba(255, 255, 255, 0.9) !important;
        font-weight: 850;
      }

      .day-tabs {
        display: flex;
        gap: 9px;
        overflow-x: auto;
        padding: 2px 0 4px;
        scrollbar-width: none;
      }

      .day-tabs::-webkit-scrollbar {
        display: none;
      }

      .day-tab {
        min-width: 108px;
        border: 1px solid rgba(23, 32, 29, 0.1);
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
        border-radius: 8px;
        padding: 11px 12px;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(25, 33, 31, 0.05);
        transition:
          transform 140ms ease,
          box-shadow 140ms ease,
          border-color 140ms ease;
      }

      .day-tab:active {
        transform: translateY(1px);
      }

      .day-tab[aria-selected="true"] {
        border-color: color-mix(in srgb, var(--accent) 70%, black);
        background:
          linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent-2) 42%, var(--accent))),
          var(--accent);
        color: #ffffff;
        box-shadow: 0 12px 26px color-mix(in srgb, var(--accent) 22%, transparent);
      }

      .day-tab strong,
      .day-tab span {
        display: block;
        white-space: nowrap;
      }

      .day-tab strong {
        font-size: 15px;
        line-height: 1.1;
      }

      .day-tab span {
        margin-top: 4px;
        font-size: 12px;
        opacity: 0.82;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 46px;
        border: 1px solid rgba(23, 32, 29, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        color: var(--ink);
        padding: 9px 11px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin: 14px 0 14px;
      }

      .summary-card {
        position: relative;
        overflow: hidden;
        min-height: 82px;
        border: 1px solid rgba(15, 118, 110, 0.18);
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        padding: 12px;
        box-shadow: 0 10px 30px rgba(25, 33, 31, 0.06);
      }

      .summary-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 5px;
        background: var(--accent);
      }

      .summary-card:nth-child(2) {
        border-color: rgba(231, 111, 81, 0.22);
      }

      .summary-card:nth-child(2)::before {
        background: var(--accent-2);
      }

      .summary-card:nth-child(3) {
        border-color: rgba(37, 99, 235, 0.2);
      }

      .summary-card:nth-child(3)::before {
        background: var(--blue);
      }

      .summary-card span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .summary-card strong {
        display: block;
        margin-top: 7px;
        font-size: 22px;
        line-height: 1;
      }

      .timeline {
        position: relative;
        display: grid;
        gap: 11px;
      }

      .info-section {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 10px;
      }

      .section-heading h2 {
        font-size: 20px;
        line-height: 1.2;
      }

      .section-heading span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-align: right;
      }

      .card-grid {
        display: grid;
        gap: 10px;
      }

      .info-card {
        display: grid;
        gap: 10px;
        padding: 13px;
        border: 1px solid rgba(23, 32, 29, 0.09);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 28px rgba(14, 31, 28, 0.09);
      }

      .info-card h3 {
        font-size: 17px;
        line-height: 1.25;
        padding-right: 28px;
      }

      .mini-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .mini-meta span {
        display: inline-flex;
        min-height: 27px;
        align-items: center;
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 10%, white);
        color: #2f3d39;
        padding: 5px 8px;
        font-size: 12px;
        font-weight: 800;
      }

      .schedule-list {
        display: grid;
        gap: 7px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .schedule-list li {
        display: grid;
        grid-template-columns: minmax(88px, auto) 1fr;
        gap: 9px;
        align-items: start;
        color: #31413d;
        font-size: 13px;
        line-height: 1.45;
      }

      .schedule-list strong {
        color: color-mix(in srgb, var(--accent) 78%, #17201d);
        font-size: 12px;
        white-space: nowrap;
      }

      .stop {
        position: relative;
        display: grid;
        grid-template-columns: 78px minmax(0, 1fr);
        gap: 13px;
        padding: 14px;
        border: 1px solid rgba(23, 32, 29, 0.09);
        border-radius: 8px;
        background:
          linear-gradient(90deg, var(--accent-soft), transparent 34%),
          rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        transition:
          transform 140ms ease,
          box-shadow 140ms ease;
      }

      .stop:active {
        transform: translateY(1px);
      }

      .stop::before {
        content: attr(data-step);
        position: absolute;
        top: 12px;
        right: 12px;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--accent);
        color: #ffffff;
        font-size: 12px;
        font-weight: 900;
      }

      .timebox {
        display: grid;
        align-content: start;
        gap: 7px;
        min-width: 0;
      }

      .arrival {
        color: color-mix(in srgb, var(--accent) 82%, #17201d);
        font-size: 23px;
        font-weight: 850;
        line-height: 1;
      }

      .leave {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .stop-main {
        display: grid;
        gap: 10px;
        min-width: 0;
      }

      .stop h2 {
        width: calc(100% - 36px);
        font-size: 18px;
        line-height: 1.25;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .address {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .details {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        border-radius: 8px;
        padding: 5px 8px;
        background: color-mix(in srgb, var(--accent) 10%, white);
        color: #31413d;
        font-size: 12px;
        font-weight: 750;
      }

      .tag.travel {
        background: color-mix(in srgb, var(--accent-2) 14%, white);
        color: #7b3a25;
      }

      .tag.note {
        background: #eef2ff;
        color: #273c7a;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition:
          transform 140ms ease,
          box-shadow 140ms ease,
          background-color 140ms ease;
      }

      .action:active {
        transform: translateY(1px);
      }

      .action.map {
        background: var(--accent);
        box-shadow: 0 10px 22px color-mix(in srgb, var(--accent) 18%, transparent);
      }

      .action.route {
        background: var(--accent-2);
        box-shadow: 0 10px 22px color-mix(in srgb, var(--accent-2) 18%, transparent);
      }

      .action.secondary {
        border-color: var(--line);
        background: #ffffff;
        color: var(--ink);
      }

      .footer-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(18px);
        width: min(calc(100% - 32px), 420px);
        border-radius: 8px;
        background: #19211f;
        color: #ffffff;
        padding: 12px 14px;

      const state = {
        selectedDay: Number(localStorage.getItem("selectedDay") || 0),
        mode: localStorage.getItem("travelMode") || "transit"
      };

      const tabsEl = document.getElementById("dayTabs");
      const timelineEl = document.getElementById("timeline");
      const routeLineEl = document.getElementById("routeLine");
      const foodSectionEl = document.getElementById("foodSection");
      const foodGridEl = document.getElementById("foodGrid");
      const extrasSectionEl = document.getElementById("extrasSection");
      const extrasGridEl = document.getElementById("extrasGrid");
      const photoTileEls = Array.from(document.querySelectorAll(".photo-tile span"));
      const startTimeEl = document.getElementById("startTime");
      const travelModeEl = document.getElementById("travelMode");
      const toastEl = document.getElementById("toast");

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function parseTime(value) {
        const [hours, minutes] = value.split(":").map(Number);
        return hours * 60 + minutes;
      }

      function formatTime(minutes) {
        const normalized = ((minutes % 1440) + 1440) % 1440;
        return `${pad(Math.floor(normalized / 60))}:${pad(normalized % 60)}`;
      }

      function formatMinutes(minutes) {
        if (minutes < 60) return `${minutes} 分`;
        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;
        return rest ? `${hours} 小時 ${rest} 分` : `${hours} 小時`;
      }

      function queryFor(stop) {
        return encodeURIComponent(`${stop.place || stop.name} ${stop.address || ""}`.trim());
      }

      function mapUrl(stop) {
        return `https://www.google.com/maps/search/?api=1&query=${queryFor(stop)}`;
      }

      function routeUrl(origin, destination) {
        const destinationQuery = queryFor(destination);
        if (!origin) {
          return `https://www.google.com/maps/dir/?api=1&destination=${destinationQuery}&travelmode=${state.mode}`;
        }
        return `https://www.google.com/maps/dir/?api=1&origin=${queryFor(origin)}&destination=${destinationQuery}&travelmode=${state.mode}`;
      }

      function fullRouteUrl(day) {
        const stops = day.stops;
        const origin = queryFor(stops[0]);
        const destination = queryFor(stops[stops.length - 1]);
        const waypoints = stops.slice(1, -1).map(queryFor).join("|");
        return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=${state.mode}`;
      }

      function scheduleFor(day) {
        if (day.fixedSchedule) {
          return day.stops.map((stop) => ({
            ...stop,
            arrival: parseTime(stop.start),
            leave: parseTime(stop.end),
            travelMinutes: stop.travelMinutes || 0,
            stayMinutes: stop.stayMinutes || parseTime(stop.end) - parseTime(stop.start)
          }));
        }

        const startOverride = localStorage.getItem(`start-${state.selectedDay}`);
        const startTime = startOverride || day.startTime;
        let cursor = parseTime(startTime);
        return day.stops.map((stop) => {
          cursor += stop.travelMinutes || 0;
          const arrival = cursor;
          const leave = arrival + stop.stayMinutes;
          cursor = leave;
          return { ...stop, arrival, leave, travelMinutes: stop.travelMinutes || 0 };
        });
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toastEl.classList.remove("show"), 1800);
      }

      function renderTabs() {
        tabsEl.innerHTML = "";
        trip.days.forEach((day, index) => {
          const button = document.createElement("button");
          button.className = "day-tab";
          button.type = "button";
          button.setAttribute("aria-selected", String(index === state.selectedDay));
          button.innerHTML = `<strong>${day.label}</strong><span>${day.title}</span>`;
          button.addEventListener("click", () => {
            state.selectedDay = index;
            localStorage.setItem("selectedDay", String(index));
            render();
          });
          tabsEl.appendChild(button);
        });
      }

      function renderRouteMap(day, scheduled) {
        document.getElementById("routeTitle").textContent = `${day.label} 行程圖`;
        document.getElementById("routeRange").textContent =
          `${formatTime(scheduled[0].arrival)} → ${formatTime(scheduled[scheduled.length - 1].leave)}`;
        routeLineEl.innerHTML = "";

        scheduled.forEach((stop, index) => {
          const link = document.createElement("a");
          link.className = "route-stop";
          link.href = mapUrl(stop);
          link.target = "_blank";
          link.rel = "noopener";
          link.dataset.step = String(index + 1).padStart(2, "0");
          if (index === scheduled.length - 1) link.dataset.last = "true";
          link.innerHTML = `
            <strong>${stop.name}</strong>
            <span class="route-time">${formatTime(stop.arrival)}-${formatTime(stop.leave)}</span>
            <span>${index === 0 ? "起點" : `前段 ${formatMinutes(stop.travelMinutes)}`}</span>
          `;
          routeLineEl.appendChild(link);
        });
      }

      function renderFood(day) {
        const foods = day.foods || [];
        foodSectionEl.hidden = foods.length === 0;
        foodGridEl.innerHTML = "";

        foods.forEach((food) => {
          const card = document.createElement("article");
          card.className = "info-card";
          card.innerHTML = `
            <div>
              <h3>${food.name}</h3>
              <p class="address">${food.address}</p>
            </div>
            <div class="mini-meta">
              <span>${food.timing}</span>
              <span>${food.memo}</span>
            </div>
            <div class="actions">
              <a class="action map" href="${mapUrl(food)}" target="_blank" rel="noopener">地圖</a>
              <a class="action route" href="${routeUrl(null, food)}" target="_blank" rel="noopener">導航</a>
            </div>
          `;
          foodGridEl.appendChild(card);
        });
      }

      function renderExtras(day, lastStop) {
        const extras = day.extras || [];
        extrasSectionEl.hidden = extras.length === 0;
        extrasGridEl.innerHTML = "";

        extras.forEach((extra) => {
          const card = document.createElement("article");
          card.className = "info-card";
          if (extra.infoOnly) {
            const scheduleRows = (extra.scheduleItems || []).map((item) => {
              return `<li><strong>${item.time}</strong><span>${item.text}</span></li>`;
            }).join("");
            card.innerHTML = `
              <div>
                <h3>${extra.name}</h3>
                <p class="address">${extra.address}</p>
              </div>
              <p class="address">${extra.memo}</p>
              ${scheduleRows ? `<ul class="schedule-list">${scheduleRows}</ul>` : ""}
            `;
            extrasGridEl.appendChild(card);
            return;
          }
          card.innerHTML = `
            <div>
              <h3>${extra.name}</h3>
              <p class="address">${extra.address}</p>
            </div>
            <div class="mini-meta">
              <span>從最後一站約 ${formatMinutes(extra.travelFromLastMinutes)}</span>
              <span>停留 ${formatMinutes(extra.stayMinutes)}</span>
            </div>
            <p class="address">${extra.memo}</p>
            <div class="actions">
              <a class="action map" href="${mapUrl(extra)}" target="_blank" rel="noopener">地圖</a>
              <a class="action route" href="${routeUrl(lastStop, extra)}" target="_blank" rel="noopener">從最後一站導航</a>
            </div>
          `;
          extrasGridEl.appendChild(card);
        });
      }

      function render() {
        const day = trip.days[state.selectedDay];
        const scheduled = scheduleFor(day);
        const totalStay = scheduled.reduce((sum, stop) => sum + stop.stayMinutes, 0);
        const totalTravel = scheduled.reduce((sum, stop) => sum + stop.travelMinutes, 0);
        const end = scheduled[scheduled.length - 1].leave;
        const firstStop = scheduled[0];
        const lastStop = scheduled[scheduled.length - 1];
        const totalSpan = end - scheduled[0].arrival;

        document.body.dataset.day = String(state.selectedDay);
        document.documentElement.style.setProperty("--day-image", `url("${day.image}")`);
        document.getElementById("tripTitle").textContent = trip.title;
        document.getElementById("tripMeta").textContent = `${trip.traveler} · ${trip.note}`;
        document.getElementById("dayLabel").textContent = `${day.date} · ${day.title}`;
        photoTileEls.forEach((tile, index) => {
          tile.textContent = day.tiles[index] || day.title;
        });
        document.getElementById("spotlightKicker").textContent = `${day.label} · ${day.date}`;
        document.getElementById("spotlightTitle").textContent = day.title;
        document.getElementById("spotlightNote").textContent =
          `${scheduled.length} 站 · 全日約 ${formatMinutes(totalSpan)} · ${day.fixedSchedule ? "固定班次時間表" : "可微調出發時間"}`;
        document.getElementById("spotlightStart").textContent = firstStop.name;
        document.getElementById("spotlightEnd").textContent = lastStop.name;
        document.getElementById("endTime").textContent = formatTime(end);
        document.getElementById("stayTotal").textContent = formatMinutes(totalStay);
        document.getElementById("travelTotal").textContent = formatMinutes(totalTravel);
        document.getElementById("fullRoute").href = fullRouteUrl(day);
        startTimeEl.value = day.fixedSchedule
          ? day.startTime
          : localStorage.getItem(`start-${state.selectedDay}`) || day.startTime;
        startTimeEl.disabled = Boolean(day.fixedSchedule);
        startTimeEl.title = day.fixedSchedule ? "此日使用固定班次時間表" : "";
        travelModeEl.value = state.mode;

        renderTabs();
        renderRouteMap(day, scheduled);
        renderFood(day);
        renderExtras(day, lastStop);
        timelineEl.innerHTML = "";

        scheduled.forEach((stop, index) => {
          const previousStop = index > 0 ? day.stops[index - 1] : null;
          const card = document.createElement("article");
          card.className = "stop";
          card.dataset.step = String(index + 1).padStart(2, "0");
          card.innerHTML = `
            <div class="timebox">
              <div class="arrival">${formatTime(stop.arrival)}</div>
              <div class="leave">離開 ${formatTime(stop.leave)}</div>
            </div>
            <div class="stop-main">
              <div>
                <h2>${stop.name}</h2>
                <p class="address">${stop.address}</p>
              </div>
              <div class="details">
                <span class="tag">停留 ${formatMinutes(stop.stayMinutes)}</span>
                <span class="tag travel">交通 ${formatMinutes(stop.travelMinutes)}</span>
                <span class="tag note">${stop.memo}</span>
              </div>
              <div class="actions">
                <a class="action map" href="${mapUrl(stop)}" target="_blank" rel="noopener">地圖</a>
                <a class="action route" href="${routeUrl(previousStop, stop)}" target="_blank" rel="noopener">導航</a>
              </div>
            </div>
          `;
          timelineEl.appendChild(card);
        });
      }

      startTimeEl.addEventListener("change", () => {
        if (trip.days[state.selectedDay].fixedSchedule) return;
        localStorage.setItem(`start-${state.selectedDay}`, startTimeEl.value);
        render();
      });

      travelModeEl.addEventListener("change", () => {
        state.mode = travelModeEl.value;
        localStorage.setItem("travelMode", state.mode);
        render();
      });

      document.getElementById("copyPlan").addEventListener("click", async () => {
        const day = trip.days[state.selectedDay];
        const lines = scheduleFor(day).map((stop) => {
          return `${formatTime(stop.arrival)}-${formatTime(stop.leave)} ${stop.name}（停留 ${formatMinutes(stop.stayMinutes)}，交通 ${formatMinutes(stop.travelMinutes)}）`;
        });
        const foodLines = (day.foods || []).map((food) => {
          return `${food.name}｜${food.timing}｜${food.memo}`;
        });
        const extraLines = (day.extras || []).map((extra) => {
          if (extra.infoOnly) {
            const scheduleText = (extra.scheduleItems || []).map((item) => {
              return `${item.time} ${item.text}`;
            }).join("；");
            return `${extra.name}｜${extra.memo}${scheduleText ? `｜${scheduleText}` : ""}`;
          }
          return `${extra.name}｜從最後一站約 ${formatMinutes(extra.travelFromLastMinutes)}｜停留 ${formatMinutes(extra.stayMinutes)}`;
        });
        const text = [
          `${trip.title} ${day.label} ${day.title}`,
          lines.join("\n"),
          foodLines.length ? `\n餐飲推薦\n${foodLines.join("\n")}` : "",
          extraLines.length ? `\n補充行程\n${extraLines.join("\n")}` : ""
        ].filter(Boolean).join("\n");
        try {
          await navigator.clipboard.writeText(text);
          showToast("今日行程已複製");
        } catch (error) {
          showToast("無法自動複製，請改用瀏覽器分享");
        }
      });

      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      }

      render();
    </script>
  </body>
</html>
